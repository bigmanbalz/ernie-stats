name: Update Band Stats

on:
  schedule:
    - cron: "20 4 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update Setlist.fm data
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: node update-band-stats.js

      - name: Update site database
        run: cp database/ernie-data.json site/ernie-data.json

      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet -- database/ernie-data.json site/ernie-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/ernie-data.json site/ernie-data.json
          git commit -m "Update live band stats data"
          git push
